<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ARENA BRAWL!</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="menu" class="screen">
  <div class="topbar">
    <div class="pill">🏆 <span id="trophyCount">0</span></div>
    <div class="logo">ARENA BRAWL!</div>
    <div class="pill gold">🪙 <span id="coinCount">0</span></div>
  </div>
  <div class="menu-left">
    <button class="menu-btn" id="btnBrawlers">😎 BRAWLERS</button>
    <button class="menu-btn" id="btnBoxes">📦 BOXES</button>
  </div>
  <div class="menu-center">
    <canvas id="mascot" width="380" height="440"></canvas>
    <div id="mascotName" class="big-label">VOLTZ</div>
  </div>
  <div class="menu-right">
    <button class="menu-btn" id="btnMode"><span id="modeBtnLabel">💀 SHOWDOWN</span></button>
    <button class="menu-btn" id="btnMaps">🗺️ <span id="mapBtnLabel">SKULL CREEK</span></button>
    <button id="btnPlay">PLAY</button>
  </div>
  <div class="controls-hint">WASD move · Mouse aim · Click shoot · SPACE / Right-click Super · Touch sticks on mobile!</div>
</div>

<div id="brawlersScreen" class="screen hidden">
  <div class="screen-title">BRAWLERS</div>
  <div class="bs-layout">
    <div id="brawlerGrid"></div>
    <div id="brawlerDetail">
      <canvas id="detailCanvas" width="300" height="330"></canvas>
      <div id="detailInfo"></div>
      <button id="btnSelectBrawler">SELECT</button>
    </div>
  </div>
  <button class="back-btn" data-back>⬅ BACK</button>
</div>

<div id="mapsScreen" class="screen hidden">
  <div class="screen-title">SELECT MAP</div>
  <div id="mapCards" class="cards"></div>
  <button class="back-btn" data-back>⬅ BACK</button>
</div>

<div id="boxesScreen" class="screen hidden">
  <div class="screen-title">BOXES</div>
  <div class="box-area">
    <div id="boxGfx">📦</div>
    <div id="boxReward" class="hidden"></div>
    <button id="btnOpenBox" class="menu-btn">OPEN BOX — 🪙 100</button>
    <div id="powerLabel" class="fineprint"></div>
    <div class="fineprint">Guaranteed rewards every time. 100% hype, 0% gambling!</div>
  </div>
  <button class="back-btn" data-back>⬅ BACK</button>
</div>

<div id="unlockScreen" class="screen hidden">
  <div class="screen-title">NEW BRAWLER!</div>
  <canvas id="unlockCanvas" width="560" height="430"></canvas>
  <div id="unlockName" class="big-label"></div>
  <div id="unlockRarity"></div>
  <div class="fineprint">Click anywhere to continue!</div>
</div>

<div id="matchScreen" class="screen hidden">
  <div class="screen-title">MATCHMAKING…</div>
  <canvas id="mapPreview" width="640" height="470"></canvas>
  <div id="matchStatus">Finding Brawlers…</div>
</div>

<div id="endScreen" class="screen hidden">
  <div id="endTitle" class="screen-title">VICTORY!</div>
  <div id="endStats"></div>
  <button id="btnMenu">CONTINUE</button>
</div>

<script src="game.js"></script>
</body>
</html>
